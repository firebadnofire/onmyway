name: Release OnMyWay APK

env:
  RELEASE_SIGNING_FINGERPRINT: 7D6EF134D851C8DA0862D97494F31AF374E2EE3C
  RELEASE_BODY: |
    Automated OnMyWay APK release.

    Every APK includes a detached armored GPG signature with the same filename
    plus `.asc`. Download both files, recover the signing key using any one of
    these methods, and verify the APK:

    ```sh
    gpg --keyserver hkps://keys.openpgp.org --recv-keys 7D6EF134D851C8DA0862D97494F31AF374E2EE3C
    # Or:
    gpg --keyserver hkps://keyserver.ubuntu.com --recv-keys 7D6EF134D851C8DA0862D97494F31AF374E2EE3C
    # Or:
    curl --proto '=https' --tlsv1.2 -fsSLo william.asc https://archuser.org/gpg/william.asc
    gpg --import william.asc

    gpg --fingerprint 7D6EF134D851C8DA0862D97494F31AF374E2EE3C
    gpg --verify <artifact>.asc <artifact>
    ```

    Confirm the recovered key fingerprint is exactly
    `7D6E F134 D851 C8DA 0862 D974 94F3 1AF3 74E2 EE3C` before trusting a
    successful signature verification.

on:
  push:
    tags:
      - "v*"
      - "V*"

jobs:
  release:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:22.04
      options: --network ci-network

    steps:
      - name: Prepare APT and action runtime
        shell: bash
        run: |
          set -euo pipefail

          apt_get="apt-get"
          tee_cmd="tee"
          install_cmd="install"
          chmod_cmd="chmod"
          if command -v sudo >/dev/null 2>&1; then
            apt_get="sudo apt-get"
            tee_cmd="sudo tee"
            install_cmd="sudo install"
            chmod_cmd="sudo chmod"
          fi

          {
            echo 'Acquire::http::Proxy "http://apt-cacher-ng:3142";'
            echo 'Acquire::https::Proxy "http://apt-cacher-ng:3142";'
          } | $tee_cmd /etc/apt/apt.conf.d/01proxy >/dev/null

          $apt_get update
          $apt_get install -y --no-install-recommends ca-certificates curl git gnupg jq unzip

          needs_node=1
          if command -v node >/dev/null 2>&1; then
            node_major="$(node -p 'process.versions.node.split(".")[0]')"
            if [ "$node_major" -ge 20 ]; then
              needs_node=0
            fi
          fi

          if [ "$needs_node" -eq 1 ]; then
            $install_cmd -d -m 0755 /etc/apt/keyrings
            curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
              | gpg --dearmor \
              | $tee_cmd /etc/apt/keyrings/nodesource.gpg >/dev/null
            $chmod_cmd a+r /etc/apt/keyrings/nodesource.gpg
            echo 'deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main' \
              | $tee_cmd /etc/apt/sources.list.d/nodesource.list >/dev/null
            $apt_get update
            $apt_get install -y --no-install-recommends nodejs
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: https://github.com/android-actions/setup-android@v3

      - name: Validate release inputs
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CI_KEY: ${{ secrets.CI_KEY }}
          CI_KEY_PASSPHRASE: ${{ secrets.CI_KEY_PASSPHRASE }}
          GH_KEY: ${{ secrets.GH_KEY }}
          GITHUB_RELEASE_OWNER: ${{ vars.GITHUB_RELEASE_OWNER }}
          GITHUB_RELEASE_REPO: ${{ vars.GITHUB_RELEASE_REPO }}
        run: |
          set -euo pipefail

          default_github_release_owner="firebadnofire"
          default_github_release_repo="OnMyWay"

          for name in KEY_ALIAS KEY_PASSWORD KEYSTORE_BASE64 KEYSTORE_PASSWORD CI_KEY CI_KEY_PASSPHRASE; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done

          if [ -n "${GITHUB_RELEASE_OWNER:-}" ] && [ -z "${GITHUB_RELEASE_REPO:-}" ]; then
            echo "GITHUB_RELEASE_REPO must be set when GITHUB_RELEASE_OWNER overrides the default GitHub target." >&2
            exit 1
          fi

          if [ -n "${GITHUB_RELEASE_REPO:-}" ] && [ -z "${GITHUB_RELEASE_OWNER:-}" ]; then
            echo "GITHUB_RELEASE_OWNER must be set when GITHUB_RELEASE_REPO overrides the default GitHub target." >&2
            exit 1
          fi

          if [ -n "${GH_KEY:-}" ]; then
            github_owner="${GITHUB_RELEASE_OWNER:-$default_github_release_owner}"
            github_repo="${GITHUB_RELEASE_REPO:-$default_github_release_repo}"
            echo "GitHub release publishing enabled for ${github_owner}/${github_repo}."
          elif [ -n "${GITHUB_RELEASE_OWNER:-}" ] || [ -n "${GITHUB_RELEASE_REPO:-}" ]; then
            echo "GH_KEY must be set when configuring GitHub release publishing." >&2
            exit 1
          fi

          if ! printf '%s' "$CI_KEY" | base64 --decode >/dev/null 2>&1; then
            echo "CI_KEY is not valid base64." >&2
            exit 1
          fi

          for tool in base64 curl git gpg jq; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "Missing required tool: ${tool}" >&2
              exit 1
            fi
          done

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          temp_dir="${RUNNER_TEMP:-${RUNNER_TMP:-/tmp}}"
          keystore_path="${temp_dir}/onmyway-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"

      - name: Build release APK
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          temp_dir="${RUNNER_TEMP:-${RUNNER_TMP:-/tmp}}"
          export RELEASE_KEYSTORE_PATH="${temp_dir}/onmyway-release.keystore"
          if [ ! -f "$RELEASE_KEYSTORE_PATH" ]; then
            echo "Release keystore was not decoded at $RELEASE_KEYSTORE_PATH" >&2
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: Prepare release asset
        shell: bash
        run: |
          set -euo pipefail

          tag="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:?Missing tag ref name}}"
          shopt -s nullglob
          apk_files=(app/build/outputs/apk/release/*.apk)

          if [ "${#apk_files[@]}" -ne 1 ]; then
            echo "Expected exactly one release APK, found ${#apk_files[@]}." >&2
            exit 1
          fi

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Missing Android SDK directory}}"
          apksigner="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner" ] || [ ! -x "$apksigner" ] || [ ! -x "${apksigner%/*}/aapt" ]; then
            echo "Android APK verification tools are unavailable." >&2
            exit 1
          fi
          "$apksigner" verify --verbose "${apk_files[0]}"
          package_info="$("${apksigner%/*}/aapt" dump badging "${apk_files[0]}" | sed -n '1p')"
          case "$package_info" in
            "package: name='org.archuser.onmyway' "*) ;;
            *) echo "Refusing to release an APK with the wrong application ID." >&2; exit 1 ;;
          esac

          mkdir -p dist
          cp "${apk_files[0]}" "dist/onmyway-${tag}.apk"

      - name: Sign release asset
        shell: bash
        env:
          CI_KEY: ${{ secrets.CI_KEY }}
          CI_KEY_PASSPHRASE: ${{ secrets.CI_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail

          tag="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:?Missing tag ref name}}"
          asset_path="dist/onmyway-${tag}.apk"
          signature_path="${asset_path}.asc"
          signing_root="${RUNNER_TEMP:-${RUNNER_TMP:-/tmp}}"
          signing_home="$(mktemp -d "${signing_root%/}/onmyway-gnupg.XXXXXX")"
          case "$signing_home" in
            "${signing_root%/}"/onmyway-gnupg.*) ;;
            *)
              echo "Refusing to use unexpected GPG home path: ${signing_home}" >&2
              exit 1
              ;;
          esac
          chmod 700 "$signing_home"
          trap 'rm -rf -- "$signing_home"' EXIT

          if [ ! -s "$asset_path" ]; then
            echo "Cannot sign missing or empty release APK: ${asset_path}" >&2
            exit 1
          fi

          if ! printf '%s' "$CI_KEY" | base64 --decode \
            | gpg --batch --homedir "$signing_home" --import; then
            echo "Failed to decode or import CI_KEY." >&2
            exit 1
          fi

          secret_key_count="$(gpg --batch --homedir "$signing_home" --with-colons --list-secret-keys \
            | awk -F: '$1 == "sec" { count += 1 } END { print count + 0 }')"
          if [ "$secret_key_count" -ne 1 ]; then
            echo "CI_KEY must contain exactly one primary secret key; found ${secret_key_count}." >&2
            exit 1
          fi

          signing_fingerprint="$(gpg --batch --homedir "$signing_home" --with-colons \
            --fingerprint --list-secret-keys \
            | awk -F: '$1 == "fpr" { print toupper($10); exit }')"
          if [ "$signing_fingerprint" != "$RELEASE_SIGNING_FINGERPRINT" ]; then
            echo "CI_KEY fingerprint does not match the pinned release signing fingerprint." >&2
            echo "Expected: ${RELEASE_SIGNING_FINGERPRINT}" >&2
            echo "Imported: ${signing_fingerprint:-<none>}" >&2
            exit 1
          fi

          rm -f -- "$signature_path"
          if ! printf '%s\n' "$CI_KEY_PASSPHRASE" \
            | gpg --batch --yes --homedir "$signing_home" \
                --pinentry-mode loopback \
                --passphrase-fd 0 \
                --local-user "$signing_fingerprint" \
                --armor \
                --detach-sign \
                --output "$signature_path" \
                "$asset_path"; then
            echo "Failed to sign release APK: ${asset_path}" >&2
            exit 1
          fi

          if [ ! -s "$signature_path" ]; then
            echo "GPG did not produce a detached signature: ${signature_path}" >&2
            exit 1
          fi

          gpg --batch --homedir "$signing_home" --verify "$signature_path" "$asset_path"

      - name: Publish Forgejo release
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          INPUT_RELEASE_BODY: ${{ env.RELEASE_BODY }}
        run: |
          set -euo pipefail

          api_url="${FORGEJO_API_URL:-${GITHUB_API_URL:?Missing Forgejo API URL}}"
          repository="${FORGEJO_REPOSITORY:-${GITHUB_REPOSITORY:?Missing repository name}}"
          tag="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:?Missing tag ref name}}"
          token="${FORGEJO_TOKEN:-${GITHUB_TOKEN:?Missing Forgejo token}}"
          owner="${repository%%/*}"
          repo="${repository#*/}"
          asset_paths="dist/onmyway-${tag}.apk dist/onmyway-${tag}.apk.asc"
          release_name="OnMyWay ${tag}"
          release_body="${INPUT_RELEASE_BODY:?Missing release body}"

          api_request() {
            local method="$1"
            local url="$2"
            shift 2
            curl --fail-with-body --silent --show-error \
              --request "$method" \
              --header "Authorization: token ${token}" \
              "$@" \
              "$url"
          }

          release_response="$(mktemp)"
          release_status="$(curl --silent --show-error \
            --output "$release_response" \
            --write-out "%{http_code}" \
            --header "Authorization: token ${token}" \
            "${api_url}/repos/${owner}/${repo}/releases/tags/${tag}")"

          if [ "$release_status" = "404" ]; then
            release_payload="$(jq -n \
              --arg tag "$tag" \
              --arg name "$release_name" \
              --arg body "$release_body" \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false, hide_archive_links: false}')"
            release_json="$(api_request POST "${api_url}/repos/${owner}/${repo}/releases" \
              --header "Content-Type: application/json" \
              --data "$release_payload")"
          elif [ "$release_status" = "200" ]; then
            release_json="$(cat "$release_response")"
            release_id="$(printf '%s' "$release_json" | jq -r '.id')"
            release_payload="$(jq -n \
              --arg tag "$tag" \
              --arg name "$release_name" \
              --arg body "$release_body" \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false, hide_archive_links: false}')"
            release_json="$(api_request PATCH "${api_url}/repos/${owner}/${repo}/releases/${release_id}" \
              --header "Content-Type: application/json" \
              --data "$release_payload")"
          else
            cat "$release_response" >&2
            echo "Failed to look up release for ${tag}: HTTP ${release_status}" >&2
            exit 1
          fi

          release_id="$(printf '%s' "$release_json" | jq -r '.id')"
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "Release response did not include an id." >&2
            exit 1
          fi

          for asset_path in $asset_paths; do
            if [ ! -s "$asset_path" ]; then
              echo "Release asset is missing or empty: ${asset_path}" >&2
              exit 1
            fi

            asset_name="$(basename "$asset_path")"
            asset_name_encoded="$(jq -nr --arg value "$asset_name" '$value|@uri')"
            existing_asset_id="$(api_request GET "${api_url}/repos/${owner}/${repo}/releases/${release_id}/assets" \
              | jq -r --arg name "$asset_name" '.[] | select(.name == $name) | .id' \
              | head -n 1)"

            if [ -n "$existing_asset_id" ]; then
              api_request DELETE "${api_url}/repos/${owner}/${repo}/releases/${release_id}/assets/${existing_asset_id}" >/dev/null
            fi

            api_request POST "${api_url}/repos/${owner}/${repo}/releases/${release_id}/assets?name=${asset_name_encoded}" \
              --form "attachment=@${asset_path}" >/dev/null
          done

      - name: Publish GitHub release
        shell: bash
        env:
          GH_KEY: ${{ secrets.GH_KEY }}
          GITHUB_RELEASE_OWNER: ${{ vars.GITHUB_RELEASE_OWNER }}
          GITHUB_RELEASE_REPO: ${{ vars.GITHUB_RELEASE_REPO }}
          INPUT_RELEASE_BODY: ${{ env.RELEASE_BODY }}
        run: |
          set -euo pipefail

          if [ -z "${GH_KEY:-}" ]; then
            echo "Skipping GitHub release publish because GH_KEY is not configured."
            exit 0
          fi

          api_url="https://api.github.com"
          upload_url="https://uploads.github.com"
          owner="${GITHUB_RELEASE_OWNER:-firebadnofire}"
          repo="${GITHUB_RELEASE_REPO:-OnMyWay}"
          tag="${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:?Missing tag ref name}}"
          token="${GH_KEY:?Missing GitHub token}"
          asset_paths="dist/onmyway-${tag}.apk dist/onmyway-${tag}.apk.asc"
          release_name="OnMyWay ${tag}"
          release_body="${INPUT_RELEASE_BODY:?Missing release body}"

          github_request() {
            local method="$1"
            local url="$2"
            local response_file
            local status
            shift 2
            response_file="$(mktemp)"
            status="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request "$method" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${token}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$@" \
              "$url")"
            if [ "$status" -lt 200 ] || [ "$status" -gt 299 ]; then
              cat "$response_file" >&2
              echo "GitHub API request failed: ${method} ${url} returned HTTP ${status}" >&2
              exit 1
            fi
            cat "$response_file"
          }

          release_response="$(mktemp)"
          release_status="$(curl --silent --show-error \
            --output "$release_response" \
            --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${token}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${api_url}/repos/${owner}/${repo}/releases/tags/${tag}")"

          if [ "$release_status" = "404" ]; then
            release_payload="$(jq -n \
              --arg tag "$tag" \
              --arg name "$release_name" \
              --arg body "$release_body" \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false, make_latest: "true"}')"
            release_json="$(github_request POST "${api_url}/repos/${owner}/${repo}/releases" \
              --header "Content-Type: application/json" \
              --data "$release_payload")"
          elif [ "$release_status" = "200" ]; then
            release_json="$(cat "$release_response")"
            release_id="$(printf '%s' "$release_json" | jq -r '.id')"
            release_payload="$(jq -n \
              --arg tag "$tag" \
              --arg name "$release_name" \
              --arg body "$release_body" \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false, make_latest: "true"}')"
            release_json="$(github_request PATCH "${api_url}/repos/${owner}/${repo}/releases/${release_id}" \
              --header "Content-Type: application/json" \
              --data "$release_payload")"
          else
            cat "$release_response" >&2
            echo "Failed to look up GitHub release for ${tag}: HTTP ${release_status}" >&2
            exit 1
          fi

          release_id="$(printf '%s' "$release_json" | jq -r '.id')"
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "GitHub release response did not include an id." >&2
            exit 1
          fi

          for asset_path in $asset_paths; do
            if [ ! -s "$asset_path" ]; then
              echo "GitHub release asset is missing or empty: ${asset_path}" >&2
              exit 1
            fi

            asset_name="$(basename "$asset_path")"
            asset_name_encoded="$(jq -nr --arg value "$asset_name" '$value|@uri')"
            existing_asset_id="$(github_request GET "${api_url}/repos/${owner}/${repo}/releases/${release_id}/assets?per_page=100" \
              | jq -r --arg name "$asset_name" '.[] | select(.name == $name) | .id' \
              | head -n 1)"

            if [ -n "$existing_asset_id" ]; then
              github_request DELETE "${api_url}/repos/${owner}/${repo}/releases/assets/${existing_asset_id}" >/dev/null
            fi

            github_request POST "${upload_url}/repos/${owner}/${repo}/releases/${release_id}/assets?name=${asset_name_encoded}" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@${asset_path}" >/dev/null
          done
